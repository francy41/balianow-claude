name: Build Android App

# Se puede lanzar manualmente desde la pestaña Actions de GitHub
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          VITE_PAYPAL_CLIENT_ID: ${{ secrets.VITE_PAYPAL_CLIENT_ID }}
        run: npm run build

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Descifrar keystore
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in android/keystore.enc \
            -out android/bailanow-release.keystore \
            -pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Dar permisos a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK firmada (para pruebas / instalación directa)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Compilar AAB firmado (para subir a Google Play)
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BailaNow-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Subir AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BailaNow-AAB-PlayStore
          path: android/app/build/outputs/bundle/release/*.aab
