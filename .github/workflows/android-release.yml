name: Android Release (AAB + APK firmados)

# Lánzalo a mano desde GitHub (pestaña Actions → "Run workflow"),
# también desde la app de GitHub en el móvil.
#
# Único secreto necesario: ANDROID_KEYSTORE_PASSWORD — la contraseña con la que
# se cifró android/keystore.enc. La clave de firma viaja cifrada en el repo, así
# que no hace falta ningún otro secreto.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Build web (Vite)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Capacitor sync
        run: npx cap sync android

      - name: Descifrar keystore de firma
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in android/keystore.enc \
            -out android/bailanow-release.keystore \
            -pass pass:"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"

      - name: Construir AAB + APK firmados
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: bailanow
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Subir artefactos (descárgalos aquí)
        uses: actions/upload-artifact@v4
        with:
          name: bailanow-android
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
