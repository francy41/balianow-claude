<!doctype html>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#444; font-family:'Nunito',system-ui,sans-serif; }

  /* ── ICONO 512×512 ── Sin esquinas redondeadas ni sombra: Google aplica
       su propia máscara y si vienen incrustadas se ven dobles. ── */
  #icono {
    width:512px; height:512px; position:relative; overflow:hidden;
    background:radial-gradient(120% 120% at 30% 15%, #FF4FA6 0%, #E5127D 38%, #A60C57 70%, #6B0637 100%);
  }
  #icono .brillo { position:absolute; inset:0;
    background:radial-gradient(60% 45% at 25% 10%, rgba(255,255,255,.28), transparent 70%); }
  #icono svg { position:absolute; left:50%; top:52%; transform:translate(-50%,-50%); height:78%; }

  /* ── CABECERA 1024×500 ── El texto se mantiene lejos de los bordes:
       Google recorta esta imagen de formas distintas según el sitio. ── */
  #cabecera {
    width:1024px; height:500px; position:relative; overflow:hidden;
    background:radial-gradient(110% 130% at 88% 50%, #FF3D9A 0%, #D4106F 22%, #7A0A4C 48%, #2A0521 76%, #140118 100%);
    display:flex; align-items:center;
  }
  #cabecera .texto { position:relative; z-index:2; padding-left:86px; max-width:600px; }
  #cabecera .kicker { color:#FF8FC4; font-size:19px; font-weight:900; letter-spacing:.22em; text-transform:uppercase; }
  #cabecera h1 { color:#fff; font-size:70px; line-height:1.0; margin-top:16px; letter-spacing:-.02em; }
  #cabecera h1 em { font-style:normal; color:#FF4FA6; }
  #cabecera p { color:rgba(255,255,255,.78); font-size:25px; margin-top:20px; font-weight:900; }
  #cabecera .pareja { position:absolute; right:40px; bottom:0; height:92%; z-index:1; }
  #cabecera .puntos { position:absolute; inset:0; opacity:.5; z-index:0; }
</style>

<div id="icono">
  <span class="brillo"></span>
  <svg viewBox="0 0 240 300"><use href="#pareja"/></svg>
</div>

<div id="cabecera">
  <svg class="puntos" viewBox="0 0 1024 500" preserveAspectRatio="none"><use href="#puntos"/></svg>
  <div class="texto">
    <div class="kicker">Vive · Conecta · Baila</div>
    <h1>Todo el baile<br>latino, en un<br><em>solo lugar</em></h1>
    <p>Eventos · Locales · Clases · Artistas</p>
  </div>
  <svg class="pareja" viewBox="0 0 240 300"><use href="#pareja"/></svg>
</div>

<script>
  // Trama de puntos del fondo de la cabecera. Generada con una función
  // periódica, no aleatoria: el resultado es idéntico en cada render.
  const g = document.getElementById('puntos');
  let s = '';
  for (let x = 20; x < 1024; x += 22) {
    for (let y = 20; y < 500; y += 22) {
      const o = 0.05 + (Math.sin(x * 0.012) * Math.cos(y * 0.015) + 1) * 0.1;
      s += `<circle cx="${x}" cy="${y}" r="2.4" opacity="${o.toFixed(3)}"/>`;
    }
  }
  g.innerHTML = s;
</script>
