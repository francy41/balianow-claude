<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <meta name="format-detection" content="telephone=no" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BailaNow" />
    <meta name="application-name" content="BailaNow" />

    <!-- SEO -->
    <title>BailaNow — DJs · Artistas · Eventos · Venues · Bachata · Salsa</title>
    <meta name="description" content="BailaNow: el ecosistema latino #1. Contrata DJs, artistas y bailarines. Descubre eventos, festivales y venues. Marketplace y livestreams 100% latino." />
    <meta name="keywords" content="BailaNow, bachata, salsa, kizomba, DJ latino, eventos latinos, latin nightlife, marketplace artistas, bailarines, conciertos latinos, España, Madrid, Barcelona" />
    <meta name="author" content="BailaNow" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://bailanow.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BailaNow" />
    <meta property="og:url" content="https://bailanow.com/" />
    <meta property="og:title" content="BailaNow — El ecosistema latino #1" />
    <meta property="og:description" content="Contrata DJs, artistas y bailarines. Descubre eventos, venues y marketplace 100% latino." />
    <meta property="og:image" content="https://bailanow.com/og-default.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@bailanow" />
    <meta name="twitter:title" content="BailaNow — El ecosistema latino #1" />
    <meta name="twitter:description" content="Contrata DJs, artistas y bailarines. Eventos, venues y marketplace latino." />
    <meta name="twitter:image" content="https://bailanow.com/og-default.svg" />

    <!-- Google Search Console: pega tu meta de verificación aquí para indexar el sitio -->
    <!-- <meta name="google-site-verification" content="TU_TOKEN_DE_SEARCH_CONSOLE" /> -->

    <!-- Datos estructurados (JSON-LD) para Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "BailaNow",
      "url": "https://bailanow.com",
      "logo": "https://bailanow.com/icon-512.png",
      "description": "BailaNow: ecosistema de danza latina. DJs, artistas y bailarines, eventos, venues, clases, marketplace y directos.",
      "sameAs": [
        "https://instagram.com/bailanow",
        "https://facebook.com/bailanow",
        "https://tiktok.com/@bailanow"
      ]
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "BailaNow",
      "url": "https://bailanow.com",
      "inLanguage": "es-ES",
      "potentialAction": {
        "@type": "SearchAction",
        "target": { "@type": "EntryPoint", "urlTemplate": "https://bailanow.com/cerca?q={search_term_string}" },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Preconnect / fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
      html, body { margin: 0; padding: 0; background: #F5F5F5; -webkit-tap-highlight-color: transparent; }
      body { font-family: Inter, system-ui, sans-serif; }
      /* Splash mientras carga el bundle JS */
      #root:empty::before {
        content: '💃';
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 80px;
        animation: bn-pulse 1.2s ease-in-out infinite;
      }
      @keyframes bn-pulse {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .safe-area-pt { padding-top: env(safe-area-inset-top); }
      .safe-area-pb { padding-bottom: env(safe-area-inset-bottom); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Contenido de respaldo para rastreadores que no ejecutan JS (mejora indexación del SPA) -->
    <noscript>
      <div style="max-width:800px;margin:0 auto;padding:24px;font-family:system-ui,sans-serif">

        <h2>Explora</h2>
        <ul>

          <li><a href="/clases">Clases y profesores</a></li>
          <li><a href="/marketplace">Marketplace de servicios</a></li>
          <li><a href="/tv">BailaNow TV — clases en vídeo</a></li>
          <li><a href="/partner/aplicar">Programa Partner de ciudad</a></li>
        </ul>
        <h2>Dónde bailar por ciudad</h2>
        <ul>
          <li><a href="/donde-bailar/bachata/Madrid">Dónde bailar bachata en Madrid</a></li>
          <li><a href="/donde-bailar/salsa/Madrid">Dónde bailar salsa en Madrid</a></li>
          <li><a href="/donde-bailar/kizomba/Madrid">Dónde bailar kizomba en Madrid</a></li>
          <li><a href="/donde-bailar/bachata/Barcelona">Dónde bailar bachata en Barcelona</a></li>
          <li><a href="/donde-bailar/salsa/Barcelona">Dónde bailar salsa en Barcelona</a></li>

        </ul>
        <p>Activa JavaScript para usar la aplicación completa.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
