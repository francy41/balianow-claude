      <stop offset="0%" stop-color="#1a0033"/><stop offset="55%" stop-color="#2d0052"/><stop offset="100%" stop-color="#08010f"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <text x="540" y="230" font-family="Arial" font-size="74" font-weight="800" fill="#fff" text-anchor="middle">Ranking mundial 🌍</text>
  <text x="540" y="310" font-family="Arial" font-size="40" font-weight="600" fill="#ffd9a8" text-anchor="middle">Suma puntos y compite con todos</text>

  <!-- podio -->
