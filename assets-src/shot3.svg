<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0033"/><stop offset="55%" stop-color="#2d0052"/><stop offset="100%" stop-color="#08010f"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)"/>
  <text x="540" y="230" font-family="Arial" font-size="74" font-weight="800" fill="#fff" text-anchor="middle">Crea coreografías</text>
  <text x="540" y="310" font-family="Arial" font-size="40" font-weight="600" fill="#ffd9a8" text-anchor="middle">Diseña la pista, formaciones y música</text>

  <!-- pista -->
  <g transform="translate(140 420)">
    <rect width="800" height="900" rx="40" fill="#1a1030" stroke="#ffffff22"/>
    <!-- grid -->
    <g stroke="#ffffff14" stroke-width="2">
      <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/><line x1="600" y1="0" x2="600" y2="900"/>
      <line x1="0" y1="225" x2="800" y2="225"/><line x1="0" y1="450" x2="800" y2="450"/><line x1="0" y1="675" x2="800" y2="675"/>
    </g>
    <!-- trayectoria -->
    <polyline points="200,720 320,500 480,460 600,300" fill="none" stroke="#ff3e6c" stroke-width="6" stroke-dasharray="14 10"/>
    <!-- bailarines -->
    <g font-family="Arial" font-size="34" font-weight="800" fill="#fff" text-anchor="middle">
      <circle cx="200" cy="720" r="42" fill="#ff3e6c"/><text x="200" y="733">♀</text>
      <circle cx="600" cy="300" r="42" fill="#22d3ee"/><text x="600" y="313">♂</text>
      <circle cx="430" cy="560" r="42" fill="#ffd23f"/><text x="430" y="573">♀</text>
      <circle cx="320" cy="320" r="42" fill="#80ed99"/><text x="320" y="333">♂</text>
    </g>
    <text x="400" y="860" font-size="28" fill="#ffffff66" text-anchor="middle" font-family="Arial">▼ PÚBLICO ▼</text>
  </g>
  <text x="540" y="1420" font-family="Arial" font-size="38" fill="#c9b8ff" text-anchor="middle">🎵 Música de YouTube, Spotify o tu archivo</text>
  <text x="540" y="1480" font-family="Arial" font-size="38" fill="#c9b8ff" text-anchor="middle">🎥 Graba movimientos con la cámara</text>
  <text x="540" y="1840" font-family="Arial" font-size="44" font-weight="800" fill="#fff" text-anchor="middle">BailaNow</text>
</svg>
