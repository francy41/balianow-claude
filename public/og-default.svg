<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#shine)"/>

  <!-- Glow detrás del texto -->
  <ellipse cx="600" cy="315" rx="500" ry="220" fill="url(#glow)"/>

  <!-- Confetti / círculos decorativos -->
  <circle cx="120" cy="100" r="6" fill="#ec4899" opacity="0.8"/>
  <circle cx="180" cy="200" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="100" cy="500" r="8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="1050" cy="120" r="5" fill="#34d399" opacity="0.7"/>
  <circle cx="1100" cy="450" r="7" fill="#ec4899" opacity="0.8"/>
  <circle cx="950" cy="540" r="4" fill="#a855f7" opacity="0.6"/>
  <circle cx="80" cy="350" r="3" fill="#fbbf24" opacity="0.5"/>
  <circle cx="1130" cy="280" r="3" fill="#34d399" opacity="0.5"/>

  <!-- Logo / Marca -->
  <g transform="translate(600 200)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="120" fill="#fff" letter-spacing="-3">
      <tspan x="0">Baila</tspan><tspan fill="url(#pink)">Now</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text x="600" y="330" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="36" fill="#e5e5e5" text-anchor="middle" opacity="0.95">
    El ecosistema latino #1 del baile
  </text>

  <!-- Pills con keywords -->
  <g transform="translate(600 410)" text-anchor="middle">
    <g>
      <rect x="-380" y="0" width="120" height="44" rx="22" fill="#ec489922" stroke="#ec4899" stroke-width="2"/>
      <text x="-320" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="#ec4899" text-anchor="middle">🎧 DJs</text>
    </g>
    <g>
      <rect x="-240" y="0" width="160" height="44" rx="22" fill="#a855f722" stroke="#a855f7" stroke-width="2"/>
      <text x="-160" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="#c084fc" text-anchor="middle">💃 Bailarines</text>
    </g>
    <g>
      <rect x="-60" y="0" width="130" height="44" rx="22" fill="#fbbf2422" stroke="#fbbf24" stroke-width="2"/>
      <text x="5" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="#fbbf24" text-anchor="middle">🎉 Eventos</text>
    </g>
    <g>
      <rect x="95" y="0" width="120" height="44" rx="22" fill="#34d39922" stroke="#34d399" stroke-width="2"/>
      <text x="155" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="#34d399" text-anchor="middle">🏛️ Venues</text>
    </g>
    <g>
      <rect x="235" y="0" width="140" height="44" rx="22" fill="#ec489922" stroke="#ec4899" stroke-width="2"/>
      <text x="305" y="29" font-family="system-ui" font-size="20" font-weight="700" fill="#ec4899" text-anchor="middle">🔴 Lives</text>
    </g>
  </g>

  <!-- URL footer -->
  <text x="600" y="570" font-family="system-ui" font-size="26" font-weight="700" fill="#fff" text-anchor="middle" opacity="0.7">
    bailanow.com
  </text>
</svg>
