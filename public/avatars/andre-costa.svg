<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Andre Costa, profesor de kizomba">
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#06262b"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04140f"/>
      <stop offset="100%" stop-color="#0c2a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <circle cx="200" cy="170" r="170" fill="url(#glow)"/>
  <g fill="#ffffff" opacity="0.15">
    <circle cx="72" cy="92" r="8"/><rect x="78" y="60" width="3" height="34"/>
    <circle cx="330" cy="118" r="7"/><rect x="335" y="92" width="3" height="28"/>
  </g>
  <!-- bailarin (kizomba, postura elegante, brazo de abrazo) -->
  <g fill="url(#body)" stroke="#5eead4" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="202" cy="116" r="25" fill="#0c2a24"/>
    <path d="M180 108 q2 -26 22 -26 q22 0 24 26 q-12 -12 -23 -12 q-12 0 -23 12 z" fill="#03100c" stroke="none"/>
    <!-- torso erguido -->
    <path d="M202 141 q28 4 28 52 l-8 64 q-20 8 -40 0 l-8 -62 q0 -50 28 -54 z"/>
    <!-- brazo de marco (abrazo) horizontal -->
    <path d="M174 176 q-44 0 -64 18 q-2 9 7 10 q40 -12 64 -12 q-2 -10 -7 -16 z"/>
    <!-- brazo apoyado -->
    <path d="M228 178 q26 4 40 24 q0 9 -9 8 q-18 -16 -36 -18 q0 -8 5 -14 z"/>
    <!-- pantalon -->
    <path d="M182 254 q20 10 40 0 l4 94 q-12 6 -22 0 l-2 -62 -4 62 q-12 6 -22 0 z" fill="#04140f" stroke="#0d9488" stroke-width="2"/>
    <path d="M158 348 q18 -8 30 -2 l0 10 q-16 6 -32 0 z" fill="#5eead4" stroke="none"/>
    <path d="M214 348 q18 -8 30 -2 l0 10 q-16 6 -32 0 z" fill="#5eead4" stroke="none"/>
  </g>
  <g font-family="'Segoe UI', Arial, sans-serif" text-anchor="middle">
    <text x="200" y="362" font-size="29" font-weight="800" fill="#ffffff">Andre Costa</text>
    <text x="200" y="386" font-size="15" font-weight="600" fill="#bdf5ec" letter-spacing="2">KIZOMBA · PROFE IA</text>
  </g>
</svg>
